# Build and publish a release when a version tag (e.g. 1.0.1) is pushed.
# Actions are pinned to commit SHAs (supply-chain hardening).
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write      # create the release
  id-token: write      # sign build provenance
  attestations: write  # publish the attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Tag must match manifest version
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      # Lets anyone verify main.js and styles.css were built from this repository:
      #   gh attestation verify main.js --repo Thattansillkid/hivemynd
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            styles.css
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
